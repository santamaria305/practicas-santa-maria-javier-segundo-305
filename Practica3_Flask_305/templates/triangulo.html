<!DOCTYPE HTML>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>calculadora de triangulo</title>
</head>
<body>
    <h2> triangulo-area y perimetro </h2>
    <form method="POST">
        <label>base</label><br>
        <input type="number" step="any" name="base" required><br><br>
        
        <label>altura</label><br>
        <input type="number" step="any" name="altura" required><br><br>
        
        <label>lado1</label><br>
        <input type="number" step="any" name="lado1" required><br><br>
        
        <label>lado2</label><br>
        <input type="number" step="any" name="lado2" required><br><br>
        
        <label>lado3</label><br>
        <input type="number" step="any" name="lado3" required><br><br>

        <button type="submit">calcular</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if area is not none and perimetro is not none %}
        <p><strong>area:</strong> {{ area }}</p>
        <p><strong>perimetro:</strong> {{ perimetro }}</p>
    {% endif %}
</body>
</html>
